metas:
- id: M01
  eixo_id: eixo_coordenacao_e_preparacao_integrada
  descricao: Designar pontos focais em 100% das áreas técnicas envolvidas e formalizar e divulgar o fluxo estadual de comunicação,
    avaliação de risco e resposta
  prazo: Até 10 dias após a validação do Plano
- id: M02
  eixo_id: eixo_coordenacao_e_preparacao_integrada
  descricao: Implantar a rotina integrada de monitoramento e manter 100% dos municípios prioritários classificados por nível
    de risco, com atualização na periodicidade estabelecida e sempre que houver mudança relevante no cenário.
  prazo: Ação contínua — atualização mensal e sempre que houver alteração relevante do risco
- id: M03
  eixo_id: eixo_coordenacao_e_preparacao_integrada
  descricao: Divulgar, dentro do prazo estabelecido, 100% dos alertas indicados pelas análises de risco durante o período
    crítico.
  prazo: Antes e durante o período crítico
- id: M04
  eixo_id: eixo_vigilancia_epidemiologica
  descricao: Definir o conjunto estadual de agravos e indicadores sentinela e monitorar 100% dos agravos selecionados na periodicidade
    estabelecida durante o período crítico.
  prazo: Definição antes do período crítico e monitoramento contínuo
- id: M05
  eixo_id: eixo_vigilancia_epidemiologica
  descricao: Realizar e divulgar a análise epidemiológica em 100% dos períodos programados
  prazo: Durante o período crítico, conforme a periodicidade definida
- id: M06
  eixo_id: eixo_vigilancia_epidemiologica
  descricao: "Monitorar 100% dos municípios com registro de DDA \nno SIVEP-DDA, diagrama de controle e tableau"
  prazo: Ação contínua — intensificar conforme o risco
- id: M07
  eixo_id: eixo_vigilancia_epidemiologica
  descricao: Investigar 100% dos surtos identificados
  prazo: Enquanto o surto estiver em andamento
- id: M08
  eixo_id: eixo_vigilancia_epidemiologica
  descricao: Detectar oportunamente aumento das internações por DDA
  prazo: Semanal/Mensal e intensificar conforme o risco
- id: M09
  eixo_id: eixo_vigilancia_epidemiologica
  descricao: Detectar oportunamente óbitos relacionados às DDA e investigar 100% dos óbitos
  prazo: Semanal/Mensal e intensificar conforme o risco
- id: M10
  eixo_id: eixo_vigilancia_epidemiologica
  descricao: Garantir 100% dos municípios prioritários abastecidos com hipoclorito, conforme necessidade identificada
  prazo: Trimestral, ou imediato conforme necessidade
- id: M11
  eixo_id: eixo_vigilancia_em_saude_ambiental
  descricao: Monitorar, conforme a programação definida, 100% dos municípios prioritários afetados pelo comprometimento do
    abastecimento de água e registrar medida de controle das não conformidades identificadas.
  prazo: Ação contínua — intensificar conforme o risco
- id: M12
  eixo_id: eixo_vigilancia_em_saude_ambiental
  descricao: Realizar análises integradas em 100% dos períodos programados durante a situação de risco e emitir orientação
    para os territórios que atingirem os critérios de alerta.
  prazo: Semanal durante o período crítico ou conforme o nível de risco
- id: M13
  eixo_id: eixo_vigilancia_em_saude_ambiental
  descricao: Monitorar 100% dos municípios prioritários na periodicidade definida e emitir orientação técnica para aqueles
    que apresentarem indicadores de risco.
  prazo: Conforme a periodicidade de cada programa; intensificar segundo o risco
- id: M14
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar 100% dos municípios prioritários sobre segurança da água nos estabelecimentos assistenciais e monitorar
    os estabelecimentos selecionados conforme critérios de risco durante o período crítico.
  prazo: Antes e durante o período crítico
- id: M15
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Executar 100% da programação de coleta ou inspeção dos estabelecimentos selecionados e registrar medida sanitária
    para os resultados insatisfatórios.
  prazo: Durante os eventos climáticos, conforme a programação de coleta
- id: M16
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar 100% das Vigilâncias Sanitárias dos municípios prioritários e monitorar, durante o calor extremo,os
    estabelecimentos incluídos na programação sanitária.
  prazo: Durante os períodos de calor extremo
- id: M17
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar 100% dos municípios prioritários e verificar as condições de armazenamento e temperatura dos estabelecimentos
    selecionados conforme o risco.
  prazo: Antes e durante o período crítico
- id: M18
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar 100% dos estabelecimentos prioritários quanto à climatização e à continuidade do fornecimento de energia
    e verificar se possuem PMOC e plano de contingência ou fonte alternativa aplicável.
  prazo: Antes do período crítico e durante interrupções do fornecimento elétrico
- id: M19
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Verificar as condições de operação, segurança e manutenção dos equipamentos em 100% dos estabelecimentos assistenciais
    incluídos na programação antes ou durante o período crítico.
  prazo: Antes e durante o período crítico
- id: M20
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar 100% das Vigilâncias Sanitárias dos municípios prioritários e monitorar os estabelecimentos selecionados,
    registrando providências das situações de risco identificadas.
  prazo: Antes e durante o período crítico
- id: M21
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Averiguar e responder 100% das denúncias sanitárias relacionadas aos eventos climáticos dentro do prazo definido
    pela Vigilância Sanitária.
  prazo: Durante os eventos climáticos extremos
- id: M22
  eixo_id: eixo_imunizacao_e_rede_de_frio
  descricao: Monitorar continuamente a manutenção das ações de imunização, as condições de funcionamento da Rede de Frio e
    a disponibilidade de estoques em 100% das Regionais de Saúde, adotando, sempre que identificadas situações de risco, medidas
    de contingência e/ou remanejamento oportuno de imunobiológicos e insumos.
  prazo: Monitoramento contínuo durante a ocorrência do evento
- id: M23
  eixo_id: eixo_laboratorio_central_de_saude_publica_lacen
  descricao: Definir, antes do período crítico, os exames prioritários e formalizar os fluxos de recebimento, processamento
    e comunicação de resultados para 100% das demandas laboratoriais priorizadas.
  prazo: Antes do período crítico e durante a resposta
- id: M24
  eixo_id: eixo_laboratorio_central_de_saude_publica_lacen
  descricao: Mapear, antes do período crítico, as rotas, os pontos críticos, os meios de transporte e as alternativas logísticas
    em 100% das regiões com territórios prioritários ou de difícil acesso.
  prazo: Antes do período crítico, com atualização conforme mudanças de acesso
- id: M25
  eixo_id: eixo_laboratorio_central_de_saude_publica_lacen
  descricao: Manter o monitoramento dos itens laboratoriais estratégicos na periodicidade estabelecida e adotar medida de
    contingência para 100% das situações com risco de interrupção da capacidade laboratorial.
  prazo: Monitoramento contínuo — intensificar conforme a demanda
- id: M26
  eixo_id: eixo_vigilancia_em_saude_do_trabalhador
  descricao: 100% dos trabalhadores expostos dos trabalhadores expostos aos riscos associados ao El Niño o perfil epidemiológico
    definido.
  prazo: Antes do período crítico, com atualização conforme a periodicidade definida
- id: M27
  eixo_id: eixo_vigilancia_em_saude_do_trabalhador
  descricao: Elaborar materiais orientadores para 100% dos riscos ocupacionais priorizados e disponibilizá-los aos Escritórios
    Regionais de Saúde, municípios e serviços envolvidos antes e durante o período crítico.
  prazo: Antes e durante o período crítico
- id: M28
  eixo_id: eixo_vigilancia_em_saude_do_trabalhador
  descricao: Executar ações de Vigilância em Ambientes e Processos de Trabalho em 100% dos municípios incluídos na programação
    e acompanhar as recomendações emitidas.
  prazo: Conforme a programação e o nível de risco
- id: M29
  eixo_id: eixo_atencao_a_saude
  descricao: Orientar 100% dos municípios prioritários e assegurar que realizem o mapeamento das populações vulneráveis, a
    avaliação da capacidade das UBS e a definição de medidas de preparação antes do período crítico.
  prazo: Antes e durante o período crítico
- id: M30
  eixo_id: eixo_atencao_a_saude
  descricao: 100% dos municípios prioritários com pessoas idosas vulneráveis identificadas e fluxo intersetorial definido.
  prazo: Antes, durante e após o período crítico
- id: M31
  eixo_id: eixo_atencao_a_saude
  descricao: 100% dos ERS orientados e serviços prioritários de Atenção Secundária preparados.
  prazo: Antes e durante o período crítico
- id: M32
  eixo_id: eixo_regulacao
  descricao: Manter, durante o período crítico, 100% dos territórios prioritários com a situação assistencial monitorada na
    periodicidade estabelecida.
  prazo: Durante o período crítico, na periodicidade estabelecida
- id: M33
  eixo_id: eixo_gestao_hospitalar
  descricao: Garantir que 100% das unidades hospitalares estratégicas tenham plano de contingência atualizado, capacidade
    instalada avaliada e protocolos assistenciais prioritários revisados antes do período crítico.
  prazo: Antes do período crítico, com monitoramento durante os eventos
- id: M34
  eixo_id: eixo_urgencia_e_emergencia
  descricao: Orientar 100% dos serviços prioritários de Urgência e Emergência e verificar, antes do período crítico, a revisão
    dos protocolos e fluxos, a comunicação com o CIEVS e a disponibilidade dos insumos essenciais.
  prazo: Antes do período crítico, com acompanhamento durante os eventos
- id: M35
  eixo_id: eixo_assistencia_farmaceutica
  descricao: Atender 100% das demandas prioritárias de reposição, remanejamento e distribuição emergencial.
  prazo: Antes do período crítico e durante a resposta
- id: M36
  eixo_id: eixo_urgencia_e_emergencia
  descricao: Fortalecer a comunicação entre Central de Regulação, NIR, unidades solicitantes e unidades executantes;
  prazo: Antes do período crítico e durante a resposta
