metas:
- id: M01
  eixo_id: eixo_governanca_e_articulacao
  descricao: 100% de governança e fluxo de coordenação estabelecidos para preparação e resposta aos efeitos do El Niño.
  prazo: Até 30 dias após validação do Plano
- id: M02
  eixo_id: eixo_governanca_e_articulacao
  descricao: Garantir que os 16 ERS disponham de fluxo atualizado para comunicação e resposta aos eventos associados ao El
    Niño.
  prazo: Até 30 dias
- id: M03
  eixo_id: eixo_inteligencia_e_avaliacao_de_risco
  descricao: Manter avaliação integrada e periódica dos riscos associados ao El Niño.
  prazo: Contínuo; intensificar conforme risco
- id: M04
  eixo_id: eixo_inteligencia_e_avaliacao_de_risco
  descricao: Garantir monitoramento dos municípios e populações prioritárias.
  prazo: Mensal e conforme agravamento
- id: M05
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: Garantir capacidade de vigilância da qualidade da água nos territórios prioritários.
  prazo: Contínuo, conforme risco
- id: M06
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: Estabelecer vigilância integrada dos impactos da fumaça e da poluição atmosférica sobre a saúde.
  prazo: Semanal nos períodos críticos ou conforme risco
- id: M07
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: Garantir a capacidade de detecção precoce de alterações no perfil de morbimortalidade relacionadas aos eventos
    climáticos.
  prazo: Até 60 dias e monitoramento contínuo
- id: M08
  eixo_id: eixo_atencao_e_capacidade_assistencial
  descricao: Preparar a Rede de Atenção à Saúde para aumento da demanda decorrente dos efeitos do El Niño.
  prazo: Até 120 dias
- id: M09
  eixo_id: eixo_atencao_e_capacidade_assistencial
  descricao: Monitorar precocemente situações de sobrecarga ou comprometimento da capacidade assistencial.
  prazo: Contínuo durante alerta/emergência
- id: M10
  eixo_id: eixo_atencao_e_capacidade_assistencial
  descricao: Garantir continuidade dos serviços essenciais de saúde durante eventos críticos.
  prazo: Até 120 dias
- id: M11
  eixo_id: eixo_assistencia_farmaceutica_e_logistica
  descricao: Assegurar capacidade logística para garantir a disponibilidade e a distribuição oportuna de medicamentos e insumos
    prioritários às regiões e municípios afetados por eventos climáticos adversos, inclusive em territórios de difícil acesso.
  prazo: Antes do período crítico e monitoramento contínuo
- id: M12
  eixo_id: eixo_assistencia_farmaceutica_e_logistica
  descricao: Fortalecer a capacidade logística para resposta em áreas remotas e de difícil acesso.
  prazo: Até 60 dias
- id: M13
  eixo_id: eixo_comunicacao_de_risco_e_vulnerabilidade
  descricao: Garantir comunicação de risco oportuna e coordenada.
  prazo: Antes e durante períodos críticos
- id: M14
  eixo_id: eixo_comunicacao_de_risco_e_vulnerabilidade
  descricao: Incorporar populações vulneráveis à priorização da preparação e resposta.
  prazo: Até 60 dias; atualização contínua
- id: M15
  eixo_id: eixo_prontidao_simulado_e_melhoria
  descricao: Avaliar a prontidão estadual para resposta aos efeitos do El Niño.
  prazo: Até 180 dias
- id: M16
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar os municípios a intensificar o monitoramento da qualidade da água utilizada nos estabelecimentos sujeitos
    à vigilância sanitária, contemplando a integridade das tubulações, a higienização periódica e a vedação de reservatórios
    e caixas d'água.
  prazo: 60 dias
- id: M17
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Monitorar  os estabelecimentos  produtores de águas envasadas e de gelo destinado ao consumo humano durante eventos
    climáticos extremos de calor, bem como o monitoramento de águas envasadas em períodos de chuvas intensas, em razão do
    aumento do risco de contaminação das fontes de captação.
  prazo: Período das chuvas intensas
- id: M18
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Garantir apoio às vigilâncias sanitárias municipais no monitoramento de estabelecimentos que manipulem, acondicionem,
    distribuam ou transportem alimentos para consumo humano, com prioridade nas escolas, instituições de longa permanência
    para idosos, unidades prisionais e outros ambientes de convivência coletiva com população vulnerável, no período de calor
    extremo.
  prazo: 30 dias
- id: M19
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar os estabelecimentos que armazenam medicamentos e imunobiológicos quanto às condições adequadas de conservação,
    incluindo o controle e o registro de temperatura, em conformidade com as especificações do fabricante e a legislação sanitária
    vigente.
  prazo: 30 dias
- id: M20
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar  os estabelecimentos assistenciais de saúde  quanto a   existência, da manutenção e da capacidade operacional
    de geradores e demais fontes alternativas de energia em ambientes prioritários, com vistas à continuidade da cadeia de
    frio de medicamentos, imunobiológicos e alimentos e ao funcionamento dos serviços críticos em situações de interrupção
    do fornecimento de energia elétrica.
  prazo: 30 dias
- id: M21
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar os estabelecimentos para que estes garantam  condições mínimas de climatização e conforto térmico, visando
    à proteção da saúde de trabalhadores, usuários e à preservação de insumos durante períodos de ondas de calor extremo.
  prazo: 30 dias
- id: M22
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar as Vigilâncias Sanitárias Municipais (VISAs) a intensificarem a fiscalização do monitoramento e controle
    de animais sinantrópicos em Estabelecimentos de Assistência à Saúde (EAS) e de Interesse à Saúde (EIS), priorizando aqueles
    voltados ao atendimento de populações vulneráveis.
  prazo: 30 dias
- id: M23
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Orientar os estabelecimentos assistenciais de saúde a garantirem as condições adequadas de operacionalidade,
    segurança e manutenção dos equipamentos médico-hospitalares.
  prazo: 30 dias
- id: M24
  eixo_id: eixo_vigilancia_sanitaria
  descricao: Priorizar e realizar o atendimento de denúncias sobre irregularidades sanitárias decorrentes ou agravadas por
    eventos climáticos extremos, visando à mitigação de riscos à saúde pública.
  prazo: Durante os eventos climáticos extremos
- id: M25
  eixo_id: eixo_imunizacao_e_rede_de_frio
  descricao: Monitorar os municípios afetados ou sob risco de impactos do El Niño nas ações de imunização
  prazo: Durante o período de ocorrência do evento
- id: M26
  eixo_id: eixo_imunizacao_e_rede_de_frio
  descricao: Assegurar a adoção de medidas de contingência da Rede de Frio dos municípios sob risco de eventos.
  prazo: Durante o período de ocorrência do evento
- id: M27
  eixo_id: eixo_imunizacao_e_rede_de_frio
  descricao: Garantir o abastecimento de imunobiológicos.
  prazo: Monitoramento mensal
- id: M28
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: Fortalecer o VIGIAR em Mato Grosso, para mitigar os efeitos das emissões das queimadas e secas severas nas populações
    e territórios mais expostos.
  prazo: Contínuo
- id: M29
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: Manter avaliação integrada e periódica dos riscos associados ao El Niño relativos a fatores de vigilância em
    saúde ambiental (escassez de água, temperaturas elevadas e queimadas)
  prazo: Contínuo com periodicidade semanal; intensificar conforme risco
- id: M30
  eixo_id: eixo_inteligencia_e_avaliacao_de_risco
  descricao: Realizar o monitoramento dos municípios e populações prioritárias
  prazo: Mensal e conforme agravamento
- id: M31
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: Fortalecer a Vigilâcia da Qualidade da Água para Consumo Humano - VIGIÁGUA em Mato Grosso, para garantir respostas
    rápidas aos riscos de contaminação decorrentes de secas extremas e inundações.
  prazo: Contínuo;  intensificar conforme risco
- id: M32
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: Detectar precocemente alterações no perfil de morbimortalidade relacionadas aos eventos climáticos.
  prazo: Até 60 dias e monitoramento contínuo
- id: M33
  eixo_id: eixo_vigilancia_ambiental_e_epidemiologica
  descricao: 'Responder em tempo oportuno aos municípios que apresentarem aumento dos indicadores de infestação

    vetorial ou risco de transmissão de arboviroses.'
  prazo: Contínuo com periodicidade quinzenal ou trimestral; intensificar conforme risco
- id: M34
  eixo_id: eixo_saude_do_trabalhador
  descricao: Fortalecer a Vigilância em Saúde do Trabalhador
  prazo: Contínuo com periodicidade quinzenal ou trimestral; intensificar conforme risco
- id: M35
  eixo_id: eixo_saude_do_trabalhador
  descricao: Comunicação e educação em saúde do trabalhador
  prazo: Contínuo com periodicidade quinzenal ou trimestral; intensificar conforme risco
- id: M36
  eixo_id: eixo_saude_do_trabalhador
  descricao: Orientar os trabalhadores quanto os processos e ambientes de trabalho adequado frente aos efeitos do El Niño,
    a partir do monitoramento da sala de situação
  prazo: Contínuo com periodicidade quinzenal ou trimestral; intensificar conforme risco
- id: M37
  eixo_id: eixo_atencao_e_capacidade_assistencial
  descricao: Fortalecer a capacidade de resposta da Rede Hospitalar.
  prazo: Antes e durante o período crítico
- id: M38
  eixo_id: eixo_atencao_e_capacidade_assistencial
  descricao: Fortalecer o apoio técnico à Atenção Secundária nos municípios e regiões prioritárias.
  prazo: Antes e durante o período crítico.
- id: M39
  eixo_id: eixo_atencao_e_capacidade_assistencial
  descricao: Fortalecer a capacidade de resposta da Rede de Urgência e Emergência.
  prazo: Antes do período crítico e monitoramento contínuo
