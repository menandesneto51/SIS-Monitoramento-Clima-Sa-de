  alvo_automacao: 'Semiautomático 8. Deliberações sugeridas para a Sala de Situação 1. Aprovar a separação formal
    entre nível de risco, estágio de resposta, desempenho do indicador e completude do dado. 2. Aprovar os perfis
    S1–S12 para que periodicidade e SLA sejam automaticamente alterados conforme Verde, Amarelo, Laranja, Vermelho
    e Roxo. 3. Aprovar ARARA-068, ARARA-073 e ARARA-074 como aliases sem cálculo próprio, mantendo 85 indicadores
    ativos. 4. Aprovar que indicadores documentais, protocolos, planos e simulados sejam gates de prontidão e não
    medidas principais da resposta em Laranja/Vermelho/Roxo. 5. Aprovar a regra de que gatilhos de risco não integram
    o Índice de Implementação/Desempenho do Plano. 6. Determinar validação técnica dos limiares e baselines antes
    do go-live, com prioridade para ARARA-013, 016, 021, 062–067 e 075–077. 7. Substituir toda expressão “meta pactuada”
    ou “conforme risco” por parâmetros numéricos/versionados no cadastro do ARARAS antes da ativação. 8. Aprovar
    o motor de completude com status NÃO CALCULÁVEL quando faltar campo crítico; denominador zero deve resultar
    em N/A. 9. Aprovar a geração automática de tarefas do PAI a partir do Amarelo para gatilho validado, indicador
    operacional fora do SLA, pendência crítica ou interrupção de serviço essencial. 10. Definir responsáveis de
    dado e de ação separadamente: quem fornece/valida o dado não necessariamente é quem executa a resposta. Proposta
    de encaminhamentoValidar hoje a arquitetura e as regras transversais; devolver aos responsáveis técnicos apenas
    os parâmetros que realmente exigem homologação (limiares, baselines, universo-alvo e SLA específicos). Isso
    evita reabrir a modelagem inteira e acelera a implementação no ARARAS. 9. Base documental analisada Controle_Indicacoes_El_Nino_SES_MT_2026.xlsx
    — aba Matriz_ARARA (88 indicadores). Plano Estadual Intersetorial de Contingência em Saúde para Eventos Associados
    ao El Niño em Mato Grosso — versão V3 / VIGIA CALOR, especialmente matriz de estágios operacionais, fluxo de
    alerta e resposta e modelo de PAI. Portaria nº 0590/2026/GBSES — governança da Sala de Situação Saúde e Clima
    El Niño 2026–2027. Nota técnica: os limiares epidemiológicos, entomológicos, ambientais, assistenciais e de
    estoque indicados como “a validar” devem ser homologados pelas áreas responsáveis antes de serem configurados
    como regra automática de produção.'
