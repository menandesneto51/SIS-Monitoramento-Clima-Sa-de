kit_calamidade_classes:
  medicamentos:
    - analgésicos/antitérmicos
    - SRO e hidratação
    - antimicrobianos de calamidade (protocolo MS)
    - medicamentos de uso contínuo (hipertensão, diabetes, asma)
  insumos:
    - hipoclorito / água segura
    - curativos e materiais de enfermagem
    - seringas e coletores
    - oxigênio e dispositivos inalatórios
