# ---------------------------------------------------------------------------
# Indicadores compostos do painel (afináveis pelo CIEVS)
# Validação empírica em 28/07/2026 (142 mun.): ver validar_pesos_indicadores.py
# Esquema escolhido: validado_jul2026 / validado_b
# - Umidade seca quase sem associação com nível (ρ≈−0,06) → peso reduzido
# - Risco cumulativo é o melhor sinal climático com cobertura plena → peso ↑
# - PM2,5/arbovírus: correlação alta mas cobertura baixa → peso moderado (não dominar)
# - saude_first sobe ρ com nível, mas comprime a escala (só ~9% acima de “moderada”)
# Override opcional via .env: PANEL_W_TENSAO_RISCO=0.50 etc.
# ---------------------------------------------------------------------------
indicadores_painel:
  tensao_climatica:
    risco_cumulativo: 0.50
    utci: 0.28
    tmax: 0.16
    umidade_seca: 0.06
  carga_saude:
    srag: 0.38
    arbovirus: 0.20
    pm25: 0.10
    pressao: 0.32
  vigilancia_integrada:
    # bruta = tensão+carga+pressão; integrada mistura com nível oficial (score)
    tensao: 0.42
    carga: 0.28
    pressao: 0.12
    nivel_operacional: 0.18
  aplicar_piso_nivel: true
  pisos_nivel:
    verde: 0
    amarela: 12
    laranja: 24
    vermelha: 38
    roxa: 48
    cinza: 0
  faixas:
    baixa_max: 30
    moderada_max: 60
    alta_max: 80
  notas_calibracao: >
    Pesos validados em jul/2026. A vigilância integrada agora inclui o nível
    operacional (18%) e pisos por cor (Roxa≥48, Vermelha≥38) para corrigir o
    viés em que municípios Roxa com baixo calor ficavam abaixo da média Vermelha.
    indice_vigilancia_bruta permanece disponível (só clima+saúde). Revisar após
    IndicaSUS estável e maior cobertura de PM2,5/arbovírus.

