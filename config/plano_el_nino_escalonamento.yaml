# Escalonamento operacional do Plano El Niño no ARARAS.
# Homologação CIEVS dos 7 itens B (pendencia_parametro) ainda aberta.
versao: '1.0'
fonte: Relatorio_Avaliacao_Escalonamento_Indicadores_ARARA_El_Nino_2026_2027.docx
produto: ARARAS
nota: 'ARARA-xxx é codigo_fonte. IDs oficiais no sistema: IND-xxx. Limiares da classe B não foram inventados
  — pendem homologação CIEVS. Estágio de ativação é decisão do Comando, independente do nível de risco.'
estagios:
- verde
- amarelo
- laranja
- vermelho
- roxo
classes:
  A: Pronto para operação escalável
  B: Usável após parametrizar SLA/limiar/denominador
  C: Gate de prontidão — não é KPI isolado de crise
  D: Alias; usar id_canonico
pesos_completude:
  fonte: 25
  atualidade: 25
  numerador: 20
  denominador: 15
  evidencia: 10
  responsavel: 5
limiares_completude:
  calculavel: 95
  ressalva: 80
duplicidades:
- id: IND-068
  id_canonico: IND-006
  codigo_fonte: ARARA-068
- id: IND-073
  id_canonico: IND-015
  codigo_fonte: ARARA-073
- id: IND-074
  id_canonico: IND-029
  codigo_fonte: ARARA-074
perfis:
  E1:
    nome: Governança e articulação
    cadencia_por_estagio:
      verde: mensal
      amarelo: 72h
      laranja: diario
      vermelho: 12-24h
      roxo: periodo_operacional
  E2:
    nome: Monitoramento e inteligência
    cadencia_por_estagio:
      verde: semanal_mensal
      amarelo: 72h
      laranja: diario
      vermelho: 12-24h
      roxo: 6-12h
  E3:
    nome: Comunicação e alerta
    cadencia_por_estagio:
      verde: preventivo
      amarelo: alerta_prioritario
      laranja: diario
      vermelho: a_cada_mudanca
      roxo: continuo
  E4:
    nome: Logística e recursos
    cadencia_por_estagio:
      verde: estoque_minimo
      amarelo: 72h
      laranja: diario
      vermelho: 12h
      roxo: turno
  E5:
    nome: Assistência e serviços
    cadencia_por_estagio:
      verde: baseline
      amarelo: prontidao
      laranja: diario
      vermelho: 12-24h
      roxo: continuo
  E6:
    nome: Vigilância sanitária
    cadencia_por_estagio:
      verde: norma_cadastro
      amarelo: orientar_visa
      laranja: 24-48h
      vermelho: fiscalizacao_focal
      roxo: risco_essencial
  E7:
    nome: Água / VIGIÁGUA
    cadencia_por_estagio:
      verde: plano_amostral
      amarelo: ampliar_vulneraveis
      laranja: 24-48h
      vermelho: diario
      roxo: humanitario
  E8:
    nome: Imunização e Rede de Frio
    cadencia_por_estagio:
      verde: rede_frio
      amarelo: autonomia_prioritarios
      laranja: diario
      vermelho: 12-24h
      roxo: servico_essencial
  E9:
    nome: Saúde do trabalhador
    cadencia_por_estagio:
      verde: perfis
      amarelo: grupos_expostos
      laranja: vigilancia_ativa
      vermelho: eventos_rapidos
      roxo: equipes_resposta
  E10:
    nome: Vulnerabilidade
    cadencia_por_estagio:
      verde: camadas
      amarelo: 72h
      laranja: busca_ativa_pai
      vermelho: protecao_integrada
      roxo: humanitario
  E11:
    nome: Simulado e melhoria
    cadencia_por_estagio:
      verde: simulado
      amarelo: checklist_prontidao
      laranja: licoes_durante
      vermelho: corretivas
      roxo: pos_incidente
  E12:
    nome: Gatilho de risco (não é meta)
    cadencia_por_estagio:
      verde: baseline
      amarelo: sinal_precoce
      laranja: ativacao_comando
      vermelho: resposta_ampliada
      roxo: mobilizacao_maxima
  E13:
    nome: Gestão da resposta / PAI
    cadencia_por_estagio:
      verde: matriz_decisao
      amarelo: pai_simplificado
      laranja: pai_completo_diario
      vermelho: 12-24h
      roxo: periodo_operacional
  E14:
    nome: Gestão territorial
    cadencia_por_estagio:
      verde: cadastro_territorial
      amarelo: 72h
      laranja: diario
      vermelho: 12-24h
      roxo: coordenacao_continua
  E15:
    nome: Sistema e continuidade digital
    cadencia_por_estagio:
      verde: disponibilidade
      amarelo: backup
      laranja: suporte_prioritario
      vermelho: 24x7
      roxo: contingencia_maxima
