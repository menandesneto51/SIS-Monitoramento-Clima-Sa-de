narrativa:
  situacao_atual: >-
    No dia 11 de junho de 2026, a NOAA decretou o estabelecimento de condições de El Niño
    no Pacífico Equatorial. Nas semanas anteriores ao boletim, os desvios de TSM atingiram
    1,4 °C na região Niño 3.4, 1,8 °C no Niño 3 e 3,0 °C no Niño 1+2. Os padrões atmosféricos
    (ventos de oeste em baixos níveis, SOI negativo) são consistentes com a resposta típica de El Niño.
  perspectivas: >-
    As médias mensais de Niño 3.4 vêm positivas desde março de 2026. A APCC indica 100% de
    probabilidade de manutenção de El Niño forte até o final de 2026. A NOAA indica 81% de
    probabilidade de atingir a categoria muito forte no trimestre outubro–novembro–dezembro.
  previsao_aso: >-
    A previsão CPTEC/INPE, INMET e FUNCEME para ASO/2026 indica precipitação abaixo da faixa
    normal no centro-norte (Norte, Nordeste e grande parte do Centro-Oeste) e acima da normal
    no Sul, podendo estender-se ao sul de São Paulo e de Mato Grosso do Sul. A temperatura
    fica acima da normal em praticamente todo o País, favorecendo ondas de calor, baixa umidade
    e maior potencial de queimadas.
  amazonia_legal: >-
    ASO marca o fim da estação seca e o início irregular da transição chuvosa na Amazônia Legal.
    Os menores acumulados concentram-se no centro-sul, especialmente em Mato Grosso, Tocantins,
    Maranhão, centro-sul de Rondônia e sul do Pará (agosto frequentemente < 20 mm). O CENSIPAM
    indica chuvas abaixo da média no centro-norte da Amazônia Legal; no extremo sul de Mato Grosso
    há sinal de precipitação acima da média histórica, ainda na estiagem — pancadas irregulares
    intercaladas por períodos secos. O El Niño tende a atrasar a estação chuvosa no sul da Amazônia
    e a manter temperatura acima da média.
  centro_oeste_monitor: >-
    Em junho de 2026 a área com seca no Centro-Oeste era quase três vezes menor que em junho de 2023
    (22%; predominância de seca fraca). Mato Grosso ficou livre de seca na atualização de junho/2026
    do Monitor de Secas. Isso não anula o risco de fogo no ASO nem a seca na bacia do Paraguai.
  hidro_paraguai: >-
    Na Região Centro-Oeste, representada pela bacia do rio Paraguai, predominam condições de seca
    entre severa e extrema — a situação hidrológica mais crítica do país, agravada por déficits
    hídricos sucessivos na última década (TSI chuva-vazão, julho/2026).
  risco_fogo: >-
    A previsão de risco de fogo para ASO intensifica o alerta alto no Centro-Oeste, especialmente
    em Mato Grosso, e na maior parte da Região Norte. Para a Amazônia Legal, o análogo CENSIPAM
    2023/2024 aponta queimadas intensas em Tocantins, Pará, Maranhão, Mato Grosso e na região AMACRO.

recomendacoes_estados:
  - Revisar e atualizar os Planos de Contingência para cenários associados ao El Niño.
  - Fortalecer monitoramento, alerta e comunicação de riscos com previsões e avisos oficiais.
  - Intensificar a articulação entre Defesa Civil, recursos hídricos, meio ambiente, saúde e assistência.
  - Identificar previamente capacidades e recursos, priorizando populações mais vulneráveis.
