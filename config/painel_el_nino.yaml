# Cenário oficial (não é output do ARARAS). Atualizar a cada boletim mensal.
# Fonte: Painel El Niño 2026-2027, boletim n.º 02 — julho/2026
# INMET, INPE, ANA, CEMADEN, SGB, SEDEC, CENSIPAM.

edicao: "02"
mes_referencia: "2026-07"
trimestre: "ASO/2026"
titulo: "Painel El Niño 2026-2027"
orgaos: "INMET, INPE, ANA, CEMADEN, SGB, SEDEC, CENSIPAM"

enso:
  status: "El Niño confirmado (NOAA, 11/06/2026)"
  intensidade: "Forte, com alta probabilidade de muito forte (anomalia TSM > 2,0 °C) na primavera/verão 2026"
  persistencia: "Modelos indicam 100% de permanência até o início de 2027"
  nino34_recente: "1,4 °C (semanas anteriores ao boletim)"

brasil_aso:
  chuva: "Abaixo da média no centro-norte (Norte, Nordeste e grande parte do Centro-Oeste); acima da média no Sul."
  temperatura: "Acima da média em praticamente todo o país — ondas de calor, baixa umidade e maior potencial de queimadas."

mato_grosso:
  chuva: "Centro-norte do Brasil abaixo da média. Extremo sul de MT com sinal de chuva acima da climatologia, ainda na estiagem (pancadas irregulares; agosto/setembro com climatologia baixa)."
  temperatura: "Acima da média na Amazônia Legal — atraso da estação chuvosa no sul da Amazônia."
  monitor_secas_jun2026: "MT livre de seca no Monitor de Secas de junho/2026 (Centro-Oeste melhor que jun/2023)."
  hidro_pantanal: "Bacia do Paraguai: situação hidrológica mais crítica do país (seca severa a extrema)."
  risco_fogo: "Alerta alto expandindo no Centro-Oeste, especialmente Mato Grosso. CENSIPAM: queimadas intensas no MT no trimestre ASO (análogo 2023/2024)."

