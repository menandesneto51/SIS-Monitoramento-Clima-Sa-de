server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Site institucional ARARAS MT (estático).
    # Painel Streamlit permanece em :8501 — não há proxy aqui.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
