# =============================================================================
# ARARAS MT — overlay PRODUÇÃO (servidor SES)
# =============================================================================
# Uso no servidor (disco local, não OneDrive):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d db etl-scheduler app landing
#
# Alertas reais só após aceite CIEVS:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile alertas up -d alerts-scheduler
#
# Rodada extraordinária de pipeline:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm pipeline
#
# Requer .env a partir de .env.producao.example (DATABASE_STRICT_POSTGRES=true).
# =============================================================================

services:
  db:
    # Em produção o Postgres só fala com localhost do host (scripts/backup).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  app:
    image: araras-mt:prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sisclima}:${POSTGRES_PASSWORD:-sisclima_trocar}@db:5432/${POSTGRES_DB:-sis_clima_saude}
      DATABASE_STRICT_POSTGRES: ${DATABASE_STRICT_POSTGRES:-true}
      SIVEP_USE_UNIFIED_DB: "true"
      COBERTURA_USAR_TRAJETO: ${COBERTURA_USAR_TRAJETO:-false}
      OSRM_URL: ${OSRM_URL:-}
      ARARAS_ALLOW_LOCAL_PREVIEW: ${ARARAS_ALLOW_LOCAL_PREVIEW:-false}
    # Imagem imutável: sem bind-mount de código Python (só dados/config/logs).
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./sql:/app/sql
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./.streamlit:/app/.streamlit:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  etl-scheduler:
    image: araras-mt:prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sisclima}:${POSTGRES_PASSWORD:-sisclima_trocar}@db:5432/${POSTGRES_DB:-sis_clima_saude}
      DATABASE_STRICT_POSTGRES: ${DATABASE_STRICT_POSTGRES:-true}
      SIVEP_USE_UNIFIED_DB: "true"
      COBERTURA_USAR_TRAJETO: ${COBERTURA_USAR_TRAJETO:-false}
      OSRM_URL: ${OSRM_URL:-}
      ETL_INTERVAL_HOURS: ${ETL_INTERVAL_HOURS:-24}
      ETL_RETRY_MINUTES: ${ETL_RETRY_MINUTES:-15}
      ETL_RUN_ON_START: ${ETL_RUN_ON_START:-true}
      ETL_FULL_ONCE_PER_DAY: ${ETL_FULL_ONCE_PER_DAY:-true}
      ETL_DAILY_HOUR: ${ETL_DAILY_HOUR:-6}
      ETL_HEALTH_FILE: ${ETL_HEALTH_FILE:-logs/etl_scheduler_health.json}
      ETL_LOCK_FILE: ${ETL_LOCK_FILE:-logs/etl_scheduler.lock}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./sql:/app/sql
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

  pipeline:
    image: araras-mt:prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sisclima}:${POSTGRES_PASSWORD:-sisclima_trocar}@db:5432/${POSTGRES_DB:-sis_clima_saude}
      DATABASE_STRICT_POSTGRES: ${DATABASE_STRICT_POSTGRES:-true}
      SIVEP_USE_UNIFIED_DB: "true"
      COBERTURA_USAR_TRAJETO: ${COBERTURA_USAR_TRAJETO:-false}
      OSRM_URL: ${OSRM_URL:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./sql:/app/sql
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

  alerts-scheduler:
    image: araras-mt:prod
    profiles: ["alertas"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sisclima}:${POSTGRES_PASSWORD:-sisclima_trocar}@db:5432/${POSTGRES_DB:-sis_clima_saude}
      DATABASE_STRICT_POSTGRES: ${DATABASE_STRICT_POSTGRES:-true}
      SIVEP_USE_UNIFIED_DB: "true"
      SEND_ALERT_ON_LEVEL_CHANGE: ${SEND_ALERT_ON_LEVEL_CHANGE:-false}
      ALERT_INTERVAL_HOURS: ${ALERT_INTERVAL_HOURS:-24}
      ALERT_DIGEST_COOLDOWN_HOURS: ${ALERT_DIGEST_COOLDOWN_HOURS:-20}
      ALERT_MIN_LEVEL: ${ALERT_MIN_LEVEL:-laranja}
      ALERT_CENTRAL_ONLY_SES: ${ALERT_CENTRAL_ONLY_SES:-true}
      ALERT_FANOUT_ENABLED: ${ALERT_FANOUT_ENABLED:-false}
      ALERT_CONTACTS_CSV: ${ALERT_CONTACTS_CSV:-data/input/contatos_alertas.csv}
      ALERT_LAYERS: ${ALERT_LAYERS:-ses,regionais,municipais,cuiaba}
      ALERT_REQUIRE_FRESH_ETL: ${ALERT_REQUIRE_FRESH_ETL:-true}
      ALERT_MAX_ETL_AGE_HOURS: ${ALERT_MAX_ETL_AGE_HOURS:-30}
      ETL_HEALTH_FILE: ${ETL_HEALTH_FILE:-logs/etl_scheduler_health.json}
      ALERT_SEND_ON_START: ${ALERT_SEND_ON_START:-false}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

  landing:
    restart: unless-stopped
